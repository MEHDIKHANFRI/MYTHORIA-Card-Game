<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MYTHORIA</title>
  <meta name="description" content="Collectionnez les cartes Mythoria, ouvrez des boosters et forgez votre deck.">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
</head>

<body class="background-arena">
        <dialog id="dialog" class="m-auto w-[400px] rounded-2xl border border-[#f6a928] bg-black from-[#29162e] to-[#100b17] p-6 text-[#ffd477] shadow-[0_0_35px_rgba(229,138,22,0.45)] backdrop:bg-black/80">
            <p id="messageDialog" class="mb-5 min-h-6 text-center font-[Georgia,serif] text-lg leading-relaxed text-[#fff0c2]"></p>
            <button id="boutonJouer" class="flex w-full  items-center justify-center rounded-xl border border-[#ffd477] bg-[#f6a928] px-6 py-3 font-[Georgia,serif] text-xl font-bold text-[#1a1020] shadow-[0_0_16px_rgba(246,169,40,0.45)] transition duration-200 hover:scale-105 ">Jouer</button>
            <button id="boutonsDeck1" class="hidden flex w-full  items-center justify-center rounded-xl border border-[#ffd477] bg-[#f6a928] px-6 py-3 font-[Georgia,serif] text-xl font-bold text-[#1a1020] shadow-[0_0_16px_rgba(246,169,40,0.45)] transition duration-200 hover:scale-105">LA LUMIERE</button>
            <button id="boutonsDeck2" class="hidden mt-2 flex w-full  items-center justify-center rounded-xl border border-[#ffd477] bg-[#f6a928] px-6 py-3 font-[Georgia,serif] text-xl font-bold text-[#1a1020] shadow-[0_0_16px_rgba(246,169,40,0.45)] transition duration-200 hover:scale-105">LES TENEBRES</button>
            <button id="fermerDialog" class="hidden mt-4 rounded-lg border border-[#ffd477] bg-black px-6 py-2 font-[Georgia,serif] text-[#ffd477] transition hover:bg-black/70">OK</button>
        </dialog>
    <header class="min-h-[76px] px-[30px] flex items-center justify-between gap-6  font-[Arial,sans-serif]">
        <nav>
            <ul class="flex items-center gap-7 m-0 p-0">
                <li><a class="min-w-[170px] px-6 py-4 border-2 rounded-[14px] bg-[rgba(18,8,24,0.9)] text-[#ffd477] font-[Georgia,serif] text-center  border-[#f6a928] shadow-[0_0_12px_#e58a16]" href="myDeck.html">Retour</a></li>
            </ul>
        </nav>
        <a class="mt-2 h-[80px] w-[150px] object-cover border-2 rounded-[14px] border-[#f6a928] shadow-[0_0_12px_#e58a16]" href="index.html" href="index.html"><img src="img/LOGO.png" alt=""></a>
    </header>
    <main>
        <section class = "grid grid-cols-[450px_450px_150px] grid-row-[100px_50px_100px] ">
            <div id="jouer1" class="w-[100%] col-span-2 items-stretch flex justify-evenly">
                
            </div>
            <div id="carteChoisie" class="w-[100%] h-auto  grid row-span-5 items-stretch ">
                <img class="w-[150px] mt-[50px] ml-[100px] h-[200px] text-center" src="img/cartesARENA.png" alt="">
                <p id="TYPE1" class="ml-[40px] mt-[10px] p-2 w-[300px] h-[50px] text-[#ffd477] font-[Georgia,serif] text-[15px] text-center border-2 border-[#f6a928] rounded-[15px] bg-[rgba(18,8,24,0.9)]"></p>
                <p id="HPadverse" class="ml-[40px] mt-[5px] mb-[5px] w-[300px] h-[50px] p-2 text-[#ffd477] font-[Georgia,serif] text-[15px]  text-center  border-2 border-[#f6a928] rounded-[15px] bg-[rgba(18,8,24,0.9)]">Points de vie de l'adversaire : <span id="hpAdverse">2000</span> HP</p>
               
                <button id="boutonAreter" class="hidden ml-[80px] flex w-[200px] h-[100px]  cursor-pointer items-center justify-center rounded-xl border border-[#f6a928] bg-black   px-5 py-3 text-center font-[Georgia,serif] text-lg font-bold text-[#ffd477] shadow-[0_0_16px_rgba(229,138,22,0.3)] transition duration-200 hover:scale-105">Fin de la partie</button>
                
                <p id="HPutilisateur" class="ml-[40px] mt-[10px] p-2 w-[300px] h-[50px] text-[#ffd477] font-[Georgia,serif] text-[15px] text-center border-2 border-[#f6a928] rounded-[15px] bg-[rgba(18,8,24,0.9)]">Vos points de vie : <span id="hpJoueur">2000</span> HP</p>
                <p id="TYPE2" class="ml-[40px] mt-[10px] p-2 w-[300px] h-[50px] text-[#ffd477] font-[Georgia,serif] text-[15px] text-center border-2 border-[#f6a928] rounded-[15px] bg-[rgba(18,8,24,0.9)]"></p>
                <img class="w-[150px]  ml-[100px] mt-[10px] h-[200px]" src="img/cartesARENA.png" alt="">
            </div>
            <div id="cartjoueur1" class=" w-[100%] mb-[5px] mt-[5px] col-span-2 items-stretch flex flex-col justify-center gap-[5px]">
                    
                    <div class="w-[100%] h-[83px]">
                        
                        <div id="defense1" class="flex flex-wrap justify-center gap-[20px]"></div>
                    </div>
                    <div class="w-[100%] h-[83px]   border-t-2 border-[#f6a928]">
                        
                        <div id="ataque1" class="flex flex-wrap justify-center gap-[20px]"></div>
                    </div>
                     
            </div>
            <div id="arena" class="w-[100%] col-span-2 items-stretch flex flex-col mt-[5px] gap-[5px] justify-center">

                
                
                <p id="resultat" class=" p-2 text-[#ffd477] font-[Georgia,serif] text-[20px] text-center border-2 border-[#f6a928] rounded-[15px] bg-[rgba(18,8,24,0.9)]">Le combat a commencé !</p>

                
            </div>
            <div id="cartjoueur2" class="w-[100%] col-span-2 items-stretch flex flex-col mt-[5px] gap-[5px] justify-center">
                <div class="w-[100%] h-[83px]   ">
                    
                    <div id="ataque2" class="flex flex-wrap justify-center gap-[20px] border-b-2 border-[#f6a928] h-[85px]"></div>
                </div>
                <div class="w-[100%] h-[83px]  rounded-[15px]">
                    
                <div id="defense2" class="flex flex-wrap justify-center gap-[20px]"></div>
                </div> 
            </div>
            <div class="col-span-2 flex flex-col justify-evenly mb-[20px]">
                 <dialog id="dialogCARTE" class="m-auto w-[400px] rounded-2xl border border-[#f6a928] bg-black from-[#29162e] to-[#100b17] p-6 text-[#ffd477] shadow-[0_0_35px_rgba(229,138,22,0.45)] backdrop:bg-black/80">
                    <button id="attaqueCARTE" class="ml-[100px] hover:scale-110 text-[black] bg-[#f6a928] rounded-[5px] border-2 border-[#f6a928] font-[Georgia,serif] text-[15px]">Attaque</button>
                    <button id="defenseCARTE" class="hover:scale-110 rounded-[5px] border-2 border-[#f6a928] text-[black] bg-[#f6a928] font-[Georgia,serif] text-[15px]">Defense </button>
                </dialog>
                <div class="">
                <div id="jouer2" class=" w-[100%] ml-[50px]  col-span-2 items-stretch flex justify-evenly"></div>
                </div>
            </div>
        </section>
    </main>
    <script src="javascript.js"></script>
    <script src="turns.js"></script>
    <script src="ui.js"></script>
    <script src="cards.js"></script>
    <script src="state.js"></script>
    <script src="combat.js"></script>
    
</body>
</html>
