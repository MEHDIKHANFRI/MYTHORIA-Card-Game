<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MYTHORIA</title>
  <meta name="description" content="Collectionnez les cartes Mythoria, ouvrez des boosters et forgez votre deck.">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body class="background-arena">
    <header class="min-h-[76px] px-[30px] flex items-center justify-between gap-6  font-[Arial,sans-serif]">
        <nav>
            <ul class="flex items-center gap-7 m-0 p-0">
                <li><a class="min-w-[170px] px-6 py-4 border-2 rounded-[14px] bg-[rgba(18,8,24,0.9)] text-[#ffd477] font-[Georgia,serif] text-center  border-[#f6a928] shadow-[0_0_12px_#e58a16]" href="myDeck.html">Retour</a></li>
            </ul>
        </nav>
        <a class="mt-2 h-[80px] w-[150px] object-cover border-2 rounded-[14px] border-[#f6a928] shadow-[0_0_12px_#e58a16]" href="index.html" href="index.html"><img src="img/LOGO.png" alt=""></a>
    </header>
    <main>
        <section class = "grid grid-cols-3 grid-row-3 ">
            <div id="jouer1" class="w-[100%] col-span-2 items-stretch flex justify-evenly">
                
            </div>
            <div id="carteChoisie" class="w-[100%]  grid row-span-5 items-stretch ">
                <img class="w-[150px] mt-[50px] ml-[100px] h-[200px] text-center" src="img/cartesARENA.png" alt="">
                <p id="HPadverse" class="ml-[40px] w-[300px] p-2 text-[#ffd477] font-[Georgia,serif] text-[15px]  text-center  border-2 border-[#f6a928] rounded-[15px] bg-[rgba(18,8,24,0.9)]">Points de vie de l'adversaire : <span id="hpAdverse">3000</span> HP</p>
               
                <button id="boutonJouer"  class="flex justify-center items-center mt-[10px] ml-10 mr-20  py-5 border-2 rounded-[15px] bg-[rgba(18,8,24,0.9)] text-[#ffd477] font-[Georgia,serif] text-xl text-center transition-transform duration-200 border-[#f6a928] shadow-[0_0_12px_#e58a16] hover:scale-110 ">Jouer</button>
                <button id="boutonAreter" class="hidden w-[200px] justify-center items-center mt-[20px] ml-[80px]   py-5 border-2 rounded-[15px] bg-[rgba(18,8,24,0.9)] text-[#ffd477] font-[Georgia,serif] text-xl text-center transition-transform duration-200 border-[#f6a928] shadow-[0_0_12px_#e58a16] hover:scale-110">Fin de la partie</button>
                <button id="boutonsDeck1" class="hidden w-[200px] justify-center items-center mt-[20px] ml-[80px]  py-5 border-2 rounded-[15px] bg-[rgba(18,8,24,0.9)] text-[#ffd477] font-[Georgia,serif] text-xl text-center transition-transform duration-200 border-[#f6a928] shadow-[0_0_12px_#e58a16] hover:scale-110">LA LUMIERE</button>
                <button id="boutonsDeck2" class="hidden w-[200px] flex justify-center items-center mt-[20px] ml-[80px]  py-5 border-2 rounded-[15px] bg-[rgba(18,8,24,0.9)] text-[#ffd477] font-[Georgia,serif] text-xl text-center transition-transform duration-200 border-[#f6a928] shadow-[0_0_12px_#e58a16] hover:scale-110">LES TENEBRES </button>

                <p id="HPutilisateur" class="ml-[40px] mt-[10px] p-2 w-[300px] text-[#ffd477] font-[Georgia,serif] text-[15px] text-center border-2 border-[#f6a928] rounded-[15px] bg-[rgba(18,8,24,0.9)]">Vos points de vie : <span id="hpJoueur">3000</span> HP</p>
                <img class="w-[150px]  ml-[100px] mt-[10px] h-[200px]" src="img/cartesARENA.png" alt="">
            </div>
            <div id="cartjoueur1" class="mt-[20px] mb-[10px] w-[100%] col-span-2 items-stretch flex  justify-center gap-[20px]">
                    <div class="w-[100%] h-auto  bg-[black] border-2 border-[#f6a928] rounded-[15px]">
                        <p class="text-center text-[#ffd477] font-[Georgia,serif]">POSITION ATTAQUE</p>
                        <div id="ataque1" class="flex flex-wrap justify-center gap-[50px]"></div>
                    </div>
                    <div class="w-[100%] border-[#f6a928] bg-[black] border-2 border-[#f6a928] rounded-[15px]">
                        <p class="text-center text-[#ffd477] font-[Georgia,serif]">POSITION DIFFENSE</p>
                        <div id="defense1" class="flex flex-wrap justify-center gap-[50px] "></div>
                    </div> 
            </div>
            <div id="arena" class=" mt-[30px] col-span-2 flex-col gap-5 justify-center h-[60%] ">

                
                
                <p id="resultat" class=" p-2 text-[#ffd477] font-[Georgia,serif] text-[20px] text-center border-2 border-[#f6a928] rounded-[15px] bg-[rgba(18,8,24,0.9)]">Le combat a commencé !</p>   

                
            </div>
            <div id="cartjoueur2" class="mb-[20px] mt-[20px] w-[100%] col-span-2 items-stretch flex  gap-[20px] justify-center ">
                <div class="w-[100%] h-auto  bg-[black] border-2 border-[#f6a928] rounded-[15px]">
                    <p class="text-center text-[#ffd477] font-[Georgia,serif]">POSITION ATTAQUE</p>
                    <div id="ataque2" class="flex flex-wrap justify-center gap-[50px]"></div>
                </div>
                <div class="w-[100%] border-[#f6a928] bg-[black] border-2 border-[#f6a928] rounded-[15px]">
                    <p class="text-center text-[#ffd477] font-[Georgia,serif]">POSITION DIFFENSE</p>
                <div id="defense2" class="flex flex-wrap justify-center gap-[50px] "></div>
                </div> 
            </div>
            <div id="jouer2" class="pl-[50px] w-[100%] col-span-2 items-stretch flex justify-evenly">
            
            </div>
        </section>
    </main>
    <script src="javascript.js"></script>
    <script src="turns.js"></script>
    <script src="ui.js"></script>
    <script src="state.js"></script>
    <script src="combat.js"></script>
    
</body>
</html>
